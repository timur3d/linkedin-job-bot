# ─────────────────────────────────────────────────────────────────────────────
# What the bot looks for. Edit it here on GitHub; the next run uses it.
#
# To see the effect of a change without sending anything, start the workflow by
# hand (Actions > Job watch > Run workflow) in `dry-run` mode: the log lists what
# would be sent, what was filtered out, and why.
#
# How often the bot checks is set by `cron` in .github/workflows/jobwatch.yml.
#
# How terms match (titles and descriptions are compared case-insensitively,
# with punctuation ignored, so "UI/UX", "ui-ux" and "UI UX" are the same):
#   - English terms match whole words, with an optional plural "s":
#       "intern" matches "Intern" and "Interns" but not "Internal".
#   - Hebrew terms match anywhere in a word: "סטודנט" also matches "לסטודנטים".
#     Gender suffixes are ignored: "מעצב/ת גרפי/ת" is read as "מעצב גרפי".
#   - "re:<pattern>" is a raw, case-sensitive regular expression.
# ─────────────────────────────────────────────────────────────────────────────

linkedin:
  locations: ["Israel"]       # each search term is run once per location
  first_run_hours: 24         # how far back the very first check looks
  max_lookback_hours: 72      # after downtime, look back at most this far
  results_per_query: 50
  pause_between_queries: [4, 9]        # seconds, random within the range
  read_descriptions: true              # open the posting to confirm unclear titles
                                       # and to detect part-time / internship
  max_descriptions_per_cycle: 60
  pause_between_descriptions: [2, 5]   # seconds
  exclude_locations: []                # e.g. ["Haifa", "North District", "חיפה"]
  exclude_companies: []                # e.g. staffing agencies you don't want

notifications:
  show_match_reason: true     # adds a "why this matched" line to each message
  repost_window_days: 14      # same title + company + location within this window = repost, skipped
  keep_history_days: 120      # forget old postings after this long (applied ones are kept)

# A job is sent when it passes at least one track.
# Inside a track: `exclude_title` is checked first, then the rules top to bottom;
# the first rule that passes accepts the job.
#   title:        the title must contain a term from EVERY group listed
#   title_not:    ...and no term from any of these groups
#   description:  ...and the posting text must contain terms from this group
#                 (at least `min_description_hits` different ones, default 1)
#   or_employment: LinkedIn's "Employment type" / "Seniority level" also satisfies the description check
#   without_description: accept | reject — what to do if the posting couldn't be read
tracks:
  - id: design
    label: Design
    emoji: "🎨"
    star: [part-time, student, freelance, internship]   # these get a ⭐
    search_terms:
      - graphic designer
      - brand designer
      - visual designer
      - UX UI designer
      - product designer
      - web designer
      - designer
      - illustrator
      - 3D artist
      - art director
      - design student
      - מעצב
      - עיצוב גרפי
    exclude_title: [not_visual_design]
    # To hide senior roles, add the `senior` group:  exclude_title: [not_visual_design, senior]
    rules:
      - name: design role in the title
        title: [design_roles]
      - name: generic design title, confirmed by the description
        title: [design_generic]
        description: design_signals
        min_description_hits: 2
        without_description: reject

  - id: cs_student
    label: CS student
    emoji: "🎓"
    star: [part-time]
    search_terms:
      - student
      - סטודנט
      - intern
      - internship
      - student software engineer
      - student developer
      - computer science student
      - student QA automation
      - student data
      - student position
    exclude_title: [not_a_student_job]
    rules:
      - name: student + tech role in the title
        title: [student, tech]
        title_not: [other_fields]
      - name: student title, CS degree named in the description
        title: [student]
        title_not: [other_fields]
        description: cs_degree
        without_description: accept
      - name: tech title, description says it is a student position
        title: [tech]
        title_not: [senior, other_fields]
        description: student_phrases
        or_employment: [internship]
        without_description: reject

# Tags shown on a message. A tag is set when the title or the description
# contains a term from the group, or LinkedIn's employment type matches.
highlights:
  part-time:
    title: part_time
    description: part_time
    employment: [parttime]
  student:
    title: student
    description: student_phrases
  internship:
    employment: [internship]
  freelance:
